name: "Beta release"

# Run from the Actions tab. "Use workflow from" picks the integration branch.
# The release is created with GITHUB_TOKEN, which does not trigger release.yml,
# so the ZIP built here is the only one attached to the prerelease.
#
# Bundled library code is only imported in the smoke job, which has no token
# and no repository credentials. Publishing happens in a separate job that
# never runs library code.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Beta version, e.g. 2026.10.1-beta1 (needs a suffix such as -beta1)"
        required: true
        type: string
      bundle_library:
        description: "Bundle pystiebeleltron from Git (the beta then requires the Home Assistant version below)"
        type: boolean
        default: false
      library_ref:
        description: "pystiebeleltron branch, tag or commit to bundle"
        type: string
        default: "master"
      library_repository:
        description: "Repository to bundle pystiebeleltron from"
        type: string
        default: "ThyMYthOS/python-stiebel-eltron"

permissions: {}

env:
  # A bundled library runs on the Modbus backend this Home Assistant version
  # pins. Raise it when a bundled library needs a newer backend.
  BUNDLED_MIN_HA: "2026.10.0"
  VERSION: ${{ inputs.version }}
  BUNDLE: ${{ inputs.bundle_library }}
  LIBRARY_REF: ${{ inputs.library_ref }}
  LIBRARY_REPOSITORY: ${{ inputs.library_repository }}

jobs:
  build:
    name: "Build"
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    steps:
      - name: "Install uv"
        uses: "astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e" # v6
        with:
          python-version: "3.14"

      - name: "Check the version"
        shell: "bash"
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?-?[A-Za-z][A-Za-z0-9.-]*$ ]]; then
            echo "::error::A beta version needs a suffix such as -beta1, got '$VERSION'"
            exit 1
          fi
          # Home Assistant refuses to load a custom integration whose manifest
          # version fails these strategies, e.g. 2026.10-test.
          uv run --no-project --with awesomeversion==25.8.0 python - <<'EOF'
          import os
          import sys

          from awesomeversion import AwesomeVersion, AwesomeVersionStrategy

          version = os.environ["VERSION"]
          try:
              AwesomeVersion(
                  version,
                  ensure_strategy=[
                      AwesomeVersionStrategy.CALVER,
                      AwesomeVersionStrategy.SEMVER,
                      AwesomeVersionStrategy.SIMPLEVER,
                      AwesomeVersionStrategy.BUILDVER,
                      AwesomeVersionStrategy.PEP440,
                  ],
              )
          except Exception as err:
              sys.exit(f"::error::Home Assistant would not load version {version}: {err}")
          EOF

      - name: "Checkout the repository"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: "Checkout the library"
        if: inputs.bundle_library
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          repository: ${{ inputs.library_repository }}
          ref: ${{ inputs.library_ref }}
          path: ".bundled-library"
          persist-credentials: false

      - name: "Build and verify the release artifact"
        shell: "bash"
        run: |
          args=()
          if [[ "$BUNDLE" == "true" ]]; then
            args=(--bundle-library .bundled-library
                  --library-repository "$LIBRARY_REPOSITORY"
                  --library-ref "$LIBRARY_REF")
          fi
          python3 scripts/build_release.py "$VERSION" "$RUNNER_TEMP/stiebel_eltron_isg.zip" "${args[@]}" |
            tee -a "$GITHUB_STEP_SUMMARY"

      - name: "Keep the artifact for the next jobs"
        uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
        with:
          name: "release-zip"
          path: ${{ runner.temp }}/stiebel_eltron_isg.zip
          if-no-files-found: error
          retention-days: 1

  smoke:
    name: "Import on the minimum Home Assistant"
    needs: build
    if: inputs.bundle_library
    runs-on: "ubuntu-latest"
    permissions: {}
    steps:
      - name: "Download the artifact"
        uses: "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
        with:
          name: "release-zip"
          path: ${{ runner.temp }}/artifact

      - name: "Install uv"
        uses: "astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e" # v6
        with:
          python-version: "3.14"

      - name: "Import every integration module"
        shell: "bash"
        run: |
          smoke="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke/custom_components/stiebel_eltron_isg"
          touch "$smoke/custom_components/__init__.py"
          unzip -q "$RUNNER_TEMP/artifact/stiebel_eltron_isg.zip" -d "$smoke/custom_components/stiebel_eltron_isg"
          manifest="https://raw.githubusercontent.com/home-assistant/core/$BUNDLED_MIN_HA/homeassistant/components/modbus/manifest.json"
          mapfile -t modbus < <(curl -fsSL "$manifest" |
            python3 -c 'import json, sys; print("\n".join(json.load(sys.stdin)["requirements"]))')
          # Install the library version core pins, as Home Assistant does, so the
          # check below catches an import that silently loads it.
          core="https://raw.githubusercontent.com/home-assistant/core/$BUNDLED_MIN_HA/homeassistant/components/stiebel_eltron/manifest.json"
          mapfile -t library < <(curl -fsSL "$core" |
            python3 -c 'import json, sys; print("\n".join(json.load(sys.stdin)["requirements"]))')
          with=(--with "homeassistant==$BUNDLED_MIN_HA")
          for requirement in "${modbus[@]}" "${library[@]}"; do with+=(--with "$requirement"); done
          cd "$smoke"
          uv run --no-project "${with[@]}" python - <<'EOF'
          import importlib
          import pkgutil
          import sys

          import importlib.util

          import custom_components.stiebel_eltron_isg as integration

          assert importlib.util.find_spec("pystiebeleltron"), "core's library is not installed"

          for module in pkgutil.iter_modules(integration.__path__):
              importlib.import_module(f"{integration.__name__}.{module.name}")
          leaked = sorted(name for name in sys.modules if name.split(".")[0] == "pystiebeleltron")
          assert not leaked, f"installed library imported: {leaked}"
          print("All integration modules import with the bundled library.")
          EOF

  publish:
    name: "Tag and publish the prerelease"
    needs: [build, smoke]
    # smoke is skipped when nothing is bundled.
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      (needs.smoke.result == 'success' || needs.smoke.result == 'skipped')
    runs-on: "ubuntu-latest"
    # Runs for the same version publish one after the other, so the existence
    # check below cannot race; different versions still run in parallel.
    concurrency:
      group: "beta-release-${{ inputs.version }}"
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      # Marks the tag and release of this run attempt, so the rollback step
      # removes only what this attempt created.
      RUN_MARKER: "beta-release run ${{ github.run_id }}/${{ github.run_attempt }}"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: "Download the artifact"
        uses: "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
        with:
          name: "release-zip"
          path: ${{ runner.temp }}/artifact

      - name: "Tag and publish the prerelease"
        id: "publish"
        shell: "bash"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="$RUNNER_TEMP/artifact/stiebel_eltron_isg.zip"
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "<!-- $RUN_MARKER -->"
            echo "Beta built from \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA}."
          } > "$notes"
          if [[ "$BUNDLE" == "true" ]]; then
            # HACS reads the minimum version from hacs.json at the release tag,
            # so only this beta asks for the newer Home Assistant.
            python3 scripts/raise_hacs_minimum.py "$BUNDLED_MIN_HA"
            git add hacs.json
            # A branch may already require this Home Assistant version or a newer one.
            if ! git diff --cached --quiet; then
              git commit -q -m "Beta $VERSION: require Home Assistant $BUNDLED_MIN_HA for the bundled library"
            fi
            commit=$(unzip -p "$zip" manifest.json |
              python3 -c 'import json, sys; print(json.load(sys.stdin)["bundled_library"]["commit"])')
            {
              echo
              echo "Bundles pystiebeleltron from ${LIBRARY_REPOSITORY} at \`${LIBRARY_REF}\` (${commit}) instead of the PyPI release."
              echo "Requires Home Assistant ${BUNDLED_MIN_HA} or newer."
            } >> "$notes"
          fi
          # Refuse an existing version, so the rollback step does not remove a
          # tag or release from an earlier publish.
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" > /dev/null ||
             gh release view "$VERSION" > /dev/null 2>&1; then
            echo "::error::Version $VERSION already has a tag or release"
            exit 1
          fi
          # An annotated tag gets an object ID of its own, unlike another
          # publisher's tag on the same commit.
          git tag -a "$VERSION" -m "Beta $VERSION ($RUN_MARKER)"
          # From here on, a failed or canceled run is rolled back by the next step.
          touch "$RUNNER_TEMP/publish-started"
          git push origin "refs/tags/$VERSION"
          # The API may not list a just pushed tag yet, and --verify-tag below
          # would then fail. Without the tag after a minute, it fails anyway.
          for _ in $(seq 30); do
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" > /dev/null 2>&1 && break
            sleep 2
          done
          gh release create "$VERSION" "$zip" \
            --prerelease --verify-tag --title "$VERSION" --notes-file "$notes"

      # Also runs when the job is canceled, so a rerun with the same version is
      # not refused because of a tag without a release. A runner that dies
      # still leaves the tag behind.
      - name: "Undo a partial publish"
        if: ${{ (failure() || cancelled()) && steps.publish.outcome != 'success' }}
        shell: "bash"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ -f "$RUNNER_TEMP/publish-started" ]] || exit 0
          gh auth setup-git
          own=$(git rev-parse "refs/tags/$VERSION")
          # Fails the step on a network or auth error instead of skipping the cleanup.
          remote=$(git ls-remote origin "refs/tags/$VERSION" | cut -f1)
          [[ -n "$remote" ]] || exit 0
          if [[ "$remote" != "$own" ]]; then
            echo "::warning::Tag $VERSION was not created by this run; leaving it"
            exit 0
          fi
          # The list includes drafts, which a partial `gh release create` leaves
          # behind. A failed request fails the step and keeps the tag.
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | [.id, .tag_name, (.body // "" | @base64)] | @tsv')
          ids=()
          while IFS=$'\t' read -r id tag body; do
            [[ "$tag" == "$VERSION" ]] || continue
            if [[ "$(base64 -d <<< "$body")" != *"<!-- $RUN_MARKER -->"* ]]; then
              echo "::warning::Release $id for $VERSION was not created by this run; leaving it and its tag"
              exit 0
            fi
            ids+=("$id")
          done <<< "$releases"
          # Delete by ID, so only the releases checked above are removed.
          for id in "${ids[@]}"; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          git push --force-with-lease="refs/tags/$VERSION:$own" origin --delete "refs/tags/$VERSION"
