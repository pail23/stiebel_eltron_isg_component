name: "Lint and test"

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  hassfest: # https://developers.home-assistant.io/blog/2020/04/16/hassfest
    name: "Hassfest Validation"
    runs-on: "ubuntu-latest"
    steps:
        - name: "Checkout the repository"
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            persist-credentials: false

        - name: "Run hassfest validation"
          uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6 # master @ 2026-07-30

  hacs: # https://github.com/hacs/action
    name: "HACS Validation"
    runs-on: "ubuntu-latest"
    steps:
        - name: "Checkout the repository"
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            persist-credentials: false

        - name: "Run HACS validation"
          uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main @ 2026-07-30
          with:
            category: "integration"

  ruff:
    name: "Ruff"
    runs-on: "ubuntu-latest"
    steps:
        - name: "Checkout the repository"
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            persist-credentials: false

        - name: Install uv
          uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v6
          with:
            python-version: 3.14
            activate-environment: true

        - name: Install the project
          run: uv sync --locked --all-extras --dev

        - name: "Run ruff"
          run: uv run --locked ruff check .

        - name: "Format with ruff"
          run: uv run --locked ruff format . --check

        - name: "Run mypy"
          run: uv run --locked mypy
  tests:
    runs-on: "ubuntu-latest"
    name: Run tests
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v6
        with:
          python-version: 3.14
          activate-environment: true

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: "Run ruff"
        run: uv run --locked ruff check .

      - name: "Format with ruff"
        run: uv run --locked ruff format . --check
      - name: Run tests
        run: |
          uv run --locked pytest \
            -qq \
            --timeout=9 \
            --durations=10 \
            -n auto \
            --cov custom_components.stiebel_eltron_isg \
            --cov-report=json:coverage.json \
            --cov-report=term-missing:skip-covered \
            -o console_output_style=count \
            -p no:sugar \
            tests
      - name: Enforce per-module coverage
        if: always()
        run: uv run --locked python scripts/check_module_coverage.py coverage.json --target 95
