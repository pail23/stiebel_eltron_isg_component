name: "Release"

on:
  release:
    types:
      - "published"

permissions: {}

jobs:
  release:
    name: "Release"
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7.0.1"
        with:
          ref: ${{ github.sha }}

      - name: "Build and verify the release artifact"
        shell: "bash"
        env:
          OUTPUT_PATH: ${{ runner.temp }}/stiebel_eltron_isg.zip
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 scripts/build_release.py "$RELEASE_TAG" "$OUTPUT_PATH" |
          tee -a "$GITHUB_STEP_SUMMARY"

      - name: "Upload the ZIP file to the release"
        uses: softprops/action-gh-release@v3.0.2
        with:
          fail_on_unmatched_files: true
          files: ${{ runner.temp }}/stiebel_eltron_isg.zip
