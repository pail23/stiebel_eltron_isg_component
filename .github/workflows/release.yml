name: "Release"

on:
  release:
    types:
      - "published"

permissions: {}

jobs:
  release:
    name: "Release"
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: "Build and verify the release artifact"
        # Explicit bash keeps pipefail enabled so a failed build cannot be
        # hidden by the successful tee process.
        shell: "bash"
        env:
          OUTPUT_PATH: ${{ runner.temp }}/stiebel_eltron_isg.zip
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 scripts/build_release.py "$RELEASE_TAG" "$OUTPUT_PATH" |
          tee -a "$GITHUB_STEP_SUMMARY"

      - name: "Upload the ZIP file to the release"
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          fail_on_unmatched_files: true
          files: ${{ runner.temp }}/stiebel_eltron_isg.zip
